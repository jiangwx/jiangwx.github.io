- title: Research Directions
  type: nested_list
  contents:
    - title: Edge LLM Processor (LPU)
      items:
        - End-to-end processor design for edge large language models.
        - Inference framework design, operator design, and operator optimization.
        - Architecture exploration, microarchitecture optimization, and software-hardware co-design.

- title: Mentoring Philosophy
  type: nested_list
  contents:
    - title: Methodology first
      items:
        - Build general methods for coding, writing, and system design before scaling projects.
    - title: Industry-oriented training
      items:
        - Combine research depth with practical engineering skills in Verilog, C++, UVM, architecture, modeling, and design.
    - title: Organized research
      items:
        - Maintain a shared LPU full-stack research platform and push key modules collaboratively.
    - title: Progressive training
      items:
        - Move from debugging and verification to independent module design and full-system ownership.

- title: Prospective Students
  type: list
  contents:
    - Welcomes motivated M.S. and Ph.D. students interested in AI processors, computer architecture, and full-stack system design.
    - Students work on a shared LPU full-stack platform with regular group meetings, technical reviews, and one-to-one discussions.
    - Career support includes internship guidance, resume feedback, and industry referrals for strong students.

- title: Academic Highlights
  type: list
  contents:
    - Published more than ten papers in TCAD, TCAS-I, TCAS-II, TVLSI, and DAC over the past five years.
    - Published six papers as first or corresponding author.
    - Holds two granted international patents.

