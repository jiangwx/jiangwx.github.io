- title: 研究方向
  type: nested_list
  contents:
    - title: 端侧大语言模型处理器（LPU）全栈设计
      items:
        - 推理框架设计
        - 算子设计与优化
        - 架构设计与探索
        - 微架构设计与优化
        - 软硬件协同设计

- title: 指导理念
  type: nested_list
  contents:
    - title: 方法论先行，理论与实践螺旋上升
      items:
        - 进组后首先系统学习一套贯穿代码编写、论文写作、方案设计的通用方法论，再通过日常科研工作将其内化。
    - title: 面向产业需求，培养全栈能力
      items:
        - 业务能力覆盖 LPU 全栈理解，包括推理框架、算子设计与优化、架构设计与探索、微架构设计与优化、软硬件协同设计。
        - 通用低阶能力包括 Verilog、C++、UVM 芯片验证；通用高阶能力包括抽象、演绎、系统思维与结构化表达。
    - title: 有组织科研，集中力量办大事
      items:
        - 课题组围绕 LPU 全栈开展研究，各位同学共同维护一个科研平台，并围绕关键模块深度优化。
    - title: 渐进式培养，因材施教
      items:
        - 调试代码或做 UVM 验证 → 独立编写 C++/Verilog 代码 → 撰写小模块方案 → 撰写中模块方案 → 撰写大模块方案 → 主导另一核心模块。

- title: 沟通机制
  type: list
  contents:
    - 每周一次全体组会对齐进度。
    - 日常不定期技术组会，包括方案串讲、方案讨论、代码检视。
    - 保持一对一答疑，确保问题能够及时解决。

- title: 实习与就业
  type: nested_list
  contents:
    - title: 就业辅导
      items:
        - 包括简历修改、模拟面试等。
        - 表现优秀者可获大厂核心部门内推机会。
    - title: 实习安排
      items:
        - 课题组与两家芯片大厂建有实习生合作关系，表现优秀者可直接内推。
        - 未满足毕业要求前原则上不允许自行外出实习；满足毕业要求后充分放行。

